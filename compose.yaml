name: campus-resource-platform

x-api: &api
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10

  m1-api:
    <<: *api
    environment:
      APP_MODULE: "services.m1.main:app"
      PORT: "3101"
      M1_DATABASE_URL: ${M1_DATABASE_URL:-}
    ports:
      - "3101:3101"

  m1-scheduler:
    <<: *api
    profiles: [m1-business]
    command: ["python", "-m", "services.m1.scheduler"]
    environment:
      APP_ENV: "production"
      M1_DATABASE_URL: ${M1_DATABASE_URL:-}
      M1_SCHEDULER_ID: "m1-scheduler"
      D_BASE_URL: "http://d-api:3104"
      D_NOTIFICATION_TOKEN: ${D_NOTIFICATION_TOKEN:-}
      D_AUDIT_TOKEN: ${D_AUDIT_TOKEN:-}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "services.m1.scheduler", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  m2-api:
    <<: *api
    environment:
      APP_MODULE: "services.m2.main:app"
      PORT: "3102"
    ports:
      - "3102:3102"

  m3-api:
    <<: *api
    environment:
      APP_MODULE: "services.m3.main:app"
      PORT: "3103"
    ports:
      - "3103:3103"

  d-api:
    <<: *api
    environment:
      APP_MODULE: "services.d.main:app"
      PORT: "3104"
    ports:
      - "3104:3104"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"

volumes:
  postgres-data:
