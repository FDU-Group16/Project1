name: CI

on:
  push:
    branches: [main, m1, m2, m3]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install uv==0.10.0
      - run: uv sync --frozen
      - run: npm --prefix apps/web ci
      - run: bash scripts/check.sh
      - name: Check staging Compose configuration
        run: DEPLOY_SHA="$GITHUB_SHA" docker compose --env-file .env.example -f compose.staging.yaml config --quiet
      - name: Build deployable API and Web images
        run: |
          docker build --pull --platform linux/amd64 -f docker/api.Dockerfile -t campus-resource-api:ci .
          docker build --pull --platform linux/amd64 -f docker/web.Dockerfile -t campus-resource-web:ci .
