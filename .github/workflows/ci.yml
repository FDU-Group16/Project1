name: CI

on:
  push:
    branches: [main, m1, m2, m3]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install uv==0.10.0
      - run: uv sync --frozen
      - run: npm --prefix apps/web ci
      - run: bash scripts/check.sh
      - name: Check staging image deployment behavior
        run: python3 scripts/test-staging-images.py
      - name: Check staging Compose configuration
        run: DEPLOY_SHA="$GITHUB_SHA" docker compose --env-file .env.example -f compose.staging.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build deployable API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: campus-resource-api:ci
          cache-from: type=gha,scope=ci-api,version=2
          cache-to: type=gha,scope=ci-api,mode=max,version=2
      - name: Build deployable Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: campus-resource-web:ci
          cache-from: type=gha,scope=ci-web,version=2
          cache-to: type=gha,scope=ci-web,mode=max,version=2
