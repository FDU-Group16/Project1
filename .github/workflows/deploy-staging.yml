name: Staging deployment

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  scaffold:
    name: Validate staging
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install uv==0.10.0
      - run: uv sync --frozen
      - run: npm --prefix apps/web ci
      - run: bash scripts/check.sh
      - name: Check staging image deployment behavior
        run: python3 scripts/test-staging-images.py
      - name: Check staging Compose configuration
        run: DEPLOY_SHA="$GITHUB_SHA" docker compose --env-file .env.example -f compose.staging.yaml config --quiet

  publish-images:
    name: Publish staging images
    needs: scaffold
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set repository image names
        id: images
        run: |
          image_name="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'prefix=ghcr.io/%s\n' "$image_name" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.images.outputs.prefix }}-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=staging-api,version=2
          cache-to: type=gha,scope=staging-api,mode=max,version=2
      - name: Build and publish Web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.images.outputs.prefix }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=staging-web,version=2
          cache-to: type=gha,scope=staging-web,mode=max,version=2
      - name: Reuse or publish pinned PostgreSQL image
        id: postgres
        env:
          STAGING_IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
        run: bash scripts/publish-staging-postgres.sh
      # Artifact metadata avoids job-output filtering when a short SSH Secret
      # (for example a port) happens to be a substring of an image digest.
      - name: Record immutable image references
        env:
          API_IMAGE: ${{ steps.images.outputs.prefix }}-api@${{ steps.api.outputs.digest }}
          WEB_IMAGE: ${{ steps.images.outputs.prefix }}-web@${{ steps.web.outputs.digest }}
          POSTGRES_IMAGE: ${{ steps.postgres.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging-images"
          printf '%s\n' "$API_IMAGE" > "$RUNNER_TEMP/staging-images/api-image.txt"
          printf '%s\n' "$WEB_IMAGE" > "$RUNNER_TEMP/staging-images/web-image.txt"
          printf '%s\n' "$POSTGRES_IMAGE" > "$RUNNER_TEMP/staging-images/postgres-image.txt"
      - name: Share image references with deployment
        uses: actions/upload-artifact@v4
        with:
          name: staging-images-${{ github.sha }}
          path: ${{ runner.temp }}/staging-images/*.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [scaffold, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: staging
    concurrency:
      group: campus-resource-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download checked image references
        uses: actions/download-artifact@v5
        with:
          name: staging-images-${{ github.sha }}
          path: ${{ runner.temp }}/staging-images
      - name: Prepare staging SSH connection
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/staging_key"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging_key" "$HOME/.ssh/known_hosts"
      - name: Deploy checked commit to staging
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_REGISTRY_USER: ${{ github.actor }}
          STAGING_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional explicit opt-in: four private passwords, never repository defaults.
          STAGING_TEST_ACCOUNTS_JSON: ${{ secrets.STAGING_TEST_ACCOUNTS_JSON }}
        run: |
          STAGING_API_IMAGE="$(cat "$RUNNER_TEMP/staging-images/api-image.txt")"
          STAGING_WEB_IMAGE="$(cat "$RUNNER_TEMP/staging-images/web-image.txt")"
          STAGING_POSTGRES_IMAGE="$(cat "$RUNNER_TEMP/staging-images/postgres-image.txt")"
          export STAGING_API_IMAGE STAGING_WEB_IMAGE STAGING_POSTGRES_IMAGE
          bash scripts/deploy-staging-upload.sh
          bash scripts/enable-staging-test-accounts-remote.sh
