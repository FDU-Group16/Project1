name: campus-resource-staging

x-api: &api
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: campus-resource-postgres:${DEPLOY_SHA:?Set DEPLOY_SHA to the release commit}
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the staging .env file}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10

  m1-api:
    <<: *api
    image: campus-resource-m1:${DEPLOY_SHA:?Set DEPLOY_SHA to the release commit}
    environment:
      APP_MODULE: "services.m1.main:app"
      PORT: "3101"
      APP_ENV: "production"
      M1_DATABASE_URL: ${M1_DATABASE_URL:-}
      D_BASE_URL: "http://d-api:3104"
      D_M1_TOKEN: ${D_M1_TOKEN:-}
      M1_M2_TOKEN: ${M1_M2_TOKEN:-}
      M1_M3_TOKEN: ${M3_M1_TOKEN:-}
      M1_CHECKIN_SECRET: ${M1_CHECKIN_SECRET:-}
    ports:
      - "127.0.0.1:3101:3101"

  m2-api:
    <<: *api
    image: campus-resource-m2:${DEPLOY_SHA:?Set DEPLOY_SHA to the release commit}
    environment:
      APP_MODULE: "services.m2.main:app"
      PORT: "3102"
    ports:
      - "127.0.0.1:3102:3102"

  m3-api:
    <<: *api
    image: campus-resource-m3:${DEPLOY_SHA:?Set DEPLOY_SHA to the release commit}
    environment:
      APP_MODULE: "services.m3.main:app"
      PORT: "3103"
      M3_MODE: "production"
      M3_DIRECTORY_MODE: "http"
      M3_DATABASE_URL: ${M3_DATABASE_URL:-}
      M3_IDENTITY_BASE_URL: ${D_IDENTITY_URL:-http://d-api:3104}
      D_BASE_URL: "http://d-api:3104"
      M3_M1_BASE_URL: "http://m1-api:3101"
      M3_M1_TOKEN: ${M3_M1_TOKEN:-}
    ports:
      - "127.0.0.1:3103:3103"

  d-api:
    <<: *api
    image: campus-resource-d:${DEPLOY_SHA:?Set DEPLOY_SHA to the release commit}
    environment:
      APP_MODULE: "services.d.main:app"
      PORT: "3104"
      APP_ENV: "production"
      D_DATABASE_URL: ${D_DATABASE_URL:-}
      D_IDENTITY_URL: ${D_IDENTITY_URL:-http://d-api:3104}
      D_M1_TOKEN: ${D_M1_TOKEN:-}
    ports:
      - "127.0.0.1:3104:3104"

  web:
    depends_on:
      m1-api:
        condition: service_started
      d-api:
        condition: service_started
      m3-api:
        condition: service_started
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: campus-resource-web:${DEPLOY_SHA:?Set DEPLOY_SHA to the release commit}
    restart: unless-stopped
    ports:
      - "${STAGING_WEB_BIND_ADDRESS:-127.0.0.1}:${STAGING_WEB_PORT:-8080}:80"

volumes:
  postgres-data:
