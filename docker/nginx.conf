server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/m1/api/v1/ {
        proxy_pass http://m1-api:3101/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/d/api/v1/ {
        proxy_pass http://d-api:3104/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/m3/v1/ {
        proxy_pass http://m3-api:3103;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
